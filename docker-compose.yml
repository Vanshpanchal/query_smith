services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: askdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      READER_DB_PASSWORD: ${READER_DB_PASSWORD}
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    environment:
      APP_DATABASE_URL: postgresql://askdata_app:${APP_DB_PASSWORD}@postgres:5432/askdata
      READER_DATABASE_URL: postgresql://askdata_reader:${READER_DB_PASSWORD}@postgres:5432/askdata
      REDIS_URL: redis://redis:6379/0
      AUTOLOAD_DATASETS: ${AUTOLOAD_DATASETS:-ipl,sales}
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
volumes:
  pgdata:
