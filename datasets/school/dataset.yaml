# Exercise dataset for the Phase 1.3–1.5 self-test. Not part of the product — delete when done.
name: school
title: School (exercises)
description: Students, courses and enrollments — toy data for loader exercises.

source:
  type: csv

tables:
  students:
    primary_key: [student_id]

  courses:
    primary_key: [course_id]
    columns:
      fees: { comment: "Course fee in INR"}

  enrollments:
    primary_key: [student_id, course_id]
    foreign_keys:
      - {columns: [student_id], references: students(student_id)}
      - {columns: [course_id], references: courses(course_id)}
