- id: q021
  question: What is the average first-innings total in IPL matches?
  gold_sql: |
    SELECT ROUND(AVG(total), 2) AS avg_first_innings_total
    FROM (
      SELECT match_id, SUM(runs_total) AS total
      FROM ipl.deliveries
      WHERE inning = 1
      GROUP BY match_id
    ) t
  expected: "168.57"
  category: aggregation
  split: test

- id: q022
  question: How many centuries (100 or more runs in one innings) have been scored in the IPL?
  gold_sql: |
    SELECT COUNT(*) AS centuries
    FROM (
      SELECT match_id, inning, batter_id
      FROM ipl.deliveries
      WHERE inning <= 2
      GROUP BY match_id, inning, batter_id
      HAVING SUM(runs_batter) >= 100
    ) t
  expected: "125"
  category: aggregation
  split: test

