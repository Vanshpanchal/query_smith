# IPL golden set: question -> verified gold SQL. Format: vault Testing.md ("Golden sets").
# Every gold_sql here was run against the loaded `ipl` schema (version eb07f40c6ef9, seasons
# 2008-2026) as askdata_reader, and the result checked by hand; `expected` records that check.
# Scoring is execution match (row/column order ignored), so keep the select list minimal:
# the entity + the one number the question asks for.
# Conventions the gold SQL follows (also the rules in datasets/ipl/notes.md, used by the prompt):
#   - match statistics exclude super overs: deliveries.inning <= 2
#   - bowler's wickets exclude run out, retired hurt, retired out, obstructing the field
#   - legal ball: extras_type IS NULL OR extras_type NOT IN ('wides', 'noballs')
#   - runs conceded by a bowler exclude byes, legbyes and penalty runs
#   - "titles"/"franchise" questions group by teams.franchise, not teams.name
# split: all `test`. Few-shot examples live in fewshots.yaml and never appear here.
# q036-q040 have no gold SQL: the expected outcome is a clarifying question or a decline.

- id: q001
  question: Who won the IPL final in 2016?
  gold_sql: |
    SELECT t.name
    FROM ipl.matches m
    JOIN ipl.teams t ON t.id = m.winner_id
    WHERE m.season = 2016 AND m.stage = 'Final'
  expected: Sunrisers Hyderabad
  category: lookup
  split: test

- id: q002
  question: At which venue was the first ever IPL match played?
  gold_sql: |
    SELECT v.name, v.city
    FROM ipl.matches m
    JOIN ipl.venues v ON v.id = m.venue_id
    ORDER BY m.match_date, m.id
    LIMIT 1
  expected: M Chinnaswamy Stadium, Bengaluru
  category: lookup
  split: test

- id: q003
  question: Which team won the most matches in the 2023 season?
  gold_sql: |
    SELECT t.name, COUNT(*) AS wins
    FROM ipl.matches m
    JOIN ipl.teams t ON t.id = m.winner_id
    WHERE m.season = 2023
    GROUP BY t.name
    ORDER BY wins DESC
    LIMIT 1
  expected: Gujarat Titans, 11
  category: aggregation
  split: test

- id: q004
  question: How many matches were played in each season?
  gold_sql: |
    SELECT season, COUNT(*) AS matches
    FROM ipl.matches
    GROUP BY season
    ORDER BY season
  expected: 19 rows, 57-76 per season (2008 = 58, 2026 = 74)
  category: aggregation
  split: test

- id: q005
  question: How many sixes were hit in each IPL season?
  gold_sql: |
    SELECT m.season, COUNT(*) AS sixes
    FROM ipl.deliveries d
    JOIN ipl.matches m ON m.id = d.match_id
    WHERE d.runs_batter = 6 AND d.inning <= 2
    GROUP BY m.season
    ORDER BY m.season
  expected: 19 rows, 2008 = 623 ... 2026 = 1,426
  category: aggregation
  split: test

- id: q006
  question: How many IPL matches have ended in a tie?
  gold_sql: |
    SELECT COUNT(*) AS ties
    FROM ipl.matches
    WHERE result = 'tie'
  expected: "16"
  category: aggregation
  split: test

- id: q007
  question: Who are the top 5 run scorers of all time in the IPL?
  gold_sql: |
    SELECT p.name, SUM(d.runs_batter) AS runs
    FROM ipl.deliveries d
    JOIN ipl.players p ON p.id = d.batter_id
    WHERE d.inning <= 2
    GROUP BY p.id, p.name
    ORDER BY runs DESC
    LIMIT 5
  expected: V Kohli 9336, RG Sharma 7329, S Dhawan 6769, DA Warner 6565, KL Rahul 5815
  category: joins
  split: test

- id: q008
  question: Which bowler has taken the most wickets in IPL history?
  gold_sql: |
    SELECT p.name, COUNT(*) AS wickets
    FROM ipl.deliveries d
    JOIN ipl.players p ON p.id = d.bowler_id
    WHERE d.is_wicket AND d.inning <= 2
      AND d.wicket_kind NOT IN ('run out', 'retired hurt', 'retired out', 'obstructing the field')
    GROUP BY p.id, p.name
    ORDER BY wickets DESC
    LIMIT 1
  expected: YS Chahal, 233
  category: joins
  split: test

