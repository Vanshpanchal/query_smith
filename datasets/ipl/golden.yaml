  split: test

- id: q012
  question: For each season since 2018, in what percentage of matches did the toss winner also win the match?
  gold_sql: |
    SELECT season,
           ROUND(100.0 * COUNT(*) FILTER (WHERE toss_winner_id = winner_id) / COUNT(*), 1)
             AS toss_winner_win_pct
    FROM ipl.matches
    WHERE season >= 2018 AND winner_id IS NOT NULL
    GROUP BY season
    ORDER BY season
  expected: 9 rows (2018-2026), 41.7 (2020) to 61.0 (2019); no-result matches excluded
  category: time
  split: test

- id: q013
  question: How many matches did Chennai Super Kings win in each season?
  gold_sql: |
    SELECT m.season, COUNT(*) AS wins
    FROM ipl.matches m
    JOIN ipl.teams t ON t.id = m.winner_id
    WHERE t.name = 'Chennai Super Kings'
    GROUP BY m.season
    ORDER BY m.season
  expected: 17 rows, no 2016-2017 (CSK suspended); 2013 = 12
  category: time
  split: test

- id: q014
  question: Who scored the most runs in each IPL season?
  gold_sql: |
    WITH season_runs AS (
      SELECT m.season, p.name, SUM(d.runs_batter) AS runs,
             RANK() OVER (PARTITION BY m.season ORDER BY SUM(d.runs_batter) DESC) AS rnk
      FROM ipl.deliveries d
      JOIN ipl.matches m ON m.id = d.match_id
      JOIN ipl.players p ON p.id = d.batter_id
      WHERE d.inning <= 2
      GROUP BY m.season, p.id, p.name
    )
    SELECT season, name, runs
    FROM season_runs
    WHERE rnk = 1
    ORDER BY season
  expected: 19 rows (no ties); 2016 = V Kohli 973, 2023 = Shubman Gill 890
  category: window/rank
  split: test

- id: q015
  question: Which bowler has the best economy rate in the death overs (overs 16 to 20), with at least 300 legal balls bowled there?
  gold_sql: |
    SELECT p.name,
           ROUND(6.0 * SUM(d.runs_total - CASE WHEN d.extras_type IN ('byes', 'legbyes', 'penalty')
                                               THEN d.runs_extras ELSE 0 END)
                 / COUNT(*) FILTER (WHERE d.extras_type IS NULL
                                     OR d.extras_type NOT IN ('wides', 'noballs')), 2) AS economy
    FROM ipl.deliveries d
    JOIN ipl.players p ON p.id = d.bowler_id
    WHERE d.over_no BETWEEN 15 AND 19 AND d.inning <= 2
    GROUP BY p.id, p.name
    HAVING COUNT(*) FILTER (WHERE d.extras_type IS NULL
                             OR d.extras_type NOT IN ('wides', 'noballs')) >= 300
    ORDER BY economy
    LIMIT 1
  expected: SP Narine, 7.25 (then SL Malinga 7.86, JJ Bumrah 8.19)
  category: domain
  split: test

