  split: test

- id: q034
  question: What is Virat Kohli's career strike rate in the IPL?
  gold_sql: |
    SELECT ROUND(100.0 * SUM(d.runs_batter)
                 / COUNT(*) FILTER (WHERE d.extras_type IS DISTINCT FROM 'wides'), 2) AS strike_rate
    FROM ipl.deliveries d
    JOIN ipl.players p ON p.id = d.batter_id
    WHERE p.name = 'V Kohli' AND d.inning <= 2
  expected: "134.80"
  category: domain
  split: test

- id: q035
  question: Which batter has the highest strike rate in the death overs (overs 16 to 20), with at least 200 balls faced there?
  gold_sql: |
    SELECT p.name,
           ROUND(100.0 * SUM(d.runs_batter)
                 / COUNT(*) FILTER (WHERE d.extras_type IS DISTINCT FROM 'wides'), 2) AS strike_rate
    FROM ipl.deliveries d
    JOIN ipl.players p ON p.id = d.batter_id
    WHERE d.over_no BETWEEN 15 AND 19 AND d.inning <= 2
    GROUP BY p.id, p.name
