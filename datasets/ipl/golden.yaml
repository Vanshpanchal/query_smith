- id: q032
  question: For each season, which team hit the most sixes?
  gold_sql: |
    WITH team_sixes AS (
      SELECT m.season, t.name, COUNT(*) AS sixes,
             RANK() OVER (PARTITION BY m.season ORDER BY COUNT(*) DESC) AS rnk
      FROM ipl.deliveries d
      JOIN ipl.matches m ON m.id = d.match_id
      JOIN ipl.teams t ON t.id = d.batting_team_id
      WHERE d.runs_batter = 6 AND d.inning <= 2
      GROUP BY m.season, t.id, t.name
    )
    SELECT season, name, sixes
    FROM team_sixes
    WHERE rnk = 1
    ORDER BY season
  expected: 19 rows (no ties); 2008 = Kings XI Punjab 95, 2026 = Rajasthan Royals 181
  category: window/rank
  split: test

