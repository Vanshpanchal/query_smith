- id: q024
  question: Which batter has been dismissed the most times by Jasprit Bumrah?
  gold_sql: |
    SELECT b.name, COUNT(*) AS dismissals
    FROM ipl.deliveries d
    JOIN ipl.players bw ON bw.id = d.bowler_id
    JOIN ipl.players b ON b.id = d.player_out_id
    WHERE bw.name = 'JJ Bumrah' AND d.is_wicket AND d.inning <= 2
      AND d.wicket_kind NOT IN ('run out', 'retired hurt', 'retired out', 'obstructing the field')
    GROUP BY b.id, b.name
    ORDER BY dismissals DESC
    LIMIT 1
  expected: RR Pant, 7 (then V Kohli and GJ Maxwell 5)
  category: joins
  split: test

