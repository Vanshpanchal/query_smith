# Verified examples injected into the SQL prompt (top-3 by similarity to the question).
# Every SQL here was run as askdata_reader on the seeded synthetic data (make_sales_data.py).

- question: Top 5 products by revenue in 2024
  sql: |
    SELECT p.name, SUM(oi.quantity * oi.unit_price - oi.discount) AS revenue
    FROM sales.order_items oi
    JOIN sales.orders o ON o.order_id = oi.order_id
    JOIN sales.products p ON p.product_id = oi.product_id
    WHERE o.order_date >= DATE '2024-01-01' AND o.order_date < DATE '2025-01-01'
      AND o.status NOT IN ('cancelled', 'returned')
    GROUP BY p.product_id, p.name
    ORDER BY revenue DESC
    LIMIT 5
  expected: Water Purifier 116991.00, Noise Cancelling Headphones 78741.00, ...

- question: How many orders came from each city?
  sql: |
    SELECT INITCAP(c.city) AS city, COUNT(*) AS orders
    FROM sales.orders o
    JOIN sales.customers c ON c.customer_id = o.customer_id
    WHERE c.city IS NOT NULL
    GROUP BY INITCAP(c.city)
    ORDER BY orders DESC
  expected: 10 rows, Delhi 72 first

- question: Monthly revenue for the last three months
  sql: |
    SELECT date_trunc('month', o.order_date)::date AS month,
           SUM(oi.quantity * oi.unit_price - oi.discount) AS revenue
    FROM sales.orders o
    JOIN sales.order_items oi ON oi.order_id = o.order_id
    WHERE o.status NOT IN ('cancelled', 'returned')
      AND o.order_date >= date_trunc('month', (SELECT MAX(order_date) FROM sales.orders))
                          - INTERVAL '2 months'
    GROUP BY 1
    ORDER BY 1
  expected: 2025-10 121433.00, 2025-11 133391.00, 2025-12 37498.00

- question: Which customers placed the most orders?
  sql: |
    SELECT c.customer_id, c.name, COUNT(*) AS orders
    FROM sales.orders o
    JOIN sales.customers c ON c.customer_id = o.customer_id
    GROUP BY c.customer_id, c.name
    ORDER BY orders DESC
    LIMIT 3
  expected: Aditya Desai 9, Saanvi Verma 8, Vivaan Reddy 8
